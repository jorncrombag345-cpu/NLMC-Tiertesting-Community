<button onclick="filterMode('UHC')">UHC</button>

<script>

const SUPABASE_URL =
"https://mgtwbthpqinyxrcnglwt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kj1HG03vn4ZMqDgC8zWzhA_CRNDty9O";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_PASSWORD = "5676";

const tierRank = {

    "LT5":1,
    "HT5":2,
    "LT4":5,
    "HT4":10,
    "LT3":12,
    "HT3":15,
    "LT2":18,
    "HT2":20,
    "LT1":25,
    "HT1":30
};

let currentFilter = "ALL";

let isAdmin = false;

let allData = [];

function login(){

    const pass =
    document.getElementById("password").value;

    if(pass === ADMIN_PASSWORD){

        isAdmin = true;

        document
        .getElementById("adminBox")
        .style.display = "block";

        alert("Ingelogd!");

        loadPlayers();

    }else{

        alert("Verkeerd wachtwoord");
    }
}

function filterMode(mode){

    currentFilter = mode;

    loadPlayers();
}

async function addPlayer(){

    const player =
    document.getElementById("playerName").value;

    const gamemode =
    document.getElementById("gamemode").value;

    const tier =
    document.getElementById("tier").value;

    if(player === "") return;

    await supabaseClient
    .from("players")
    .insert([
        {
            player,
            gamemode,
            tier
        }
    ]);

    document
    .getElementById("playerName")
    .value = "";

    loadPlayers();
}

async function deleteTier(id){

    await supabaseClient
    .from("players")
    .delete()
    .eq("id",id);

    loadPlayers();
}

function openPlayer(player){

    const popup =
    document.getElementById("popup");

    const popupName =
    document.getElementById("popupName");

    const popupStats =
    document.getElementById("popupStats");

    popup.style.display = "flex";

    popupName.innerHTML = player;

    let playerData =
    allData.filter(x => x.player === player);

    let html = "";

    let total = 0;

    playerData.forEach(entry => {

        total += tierRank[entry.tier];

        html += `

        <div class="mode">

            <div class="modeText">

                ${entry.gamemode}
                •
                ${entry.tier}
                •
                ${tierRank[entry.tier]} punten

            </div>

            ${
                isAdmin
                ?
                `
                <button
                class="deleteBtn"
                onclick="deleteTier(${entry.id})"
                >
                ❌
                </button>
                `
                :
                ""
            }

        </div>

        `;
    });

    popupStats.innerHTML = `

    <div class="total">

        ⭐ ${total} punten totaal

    </div>

    ${html}

    `;
}

function closePopup(){

    document
    .getElementById("popup")
    .style.display = "none";
}

async function loadPlayers(){

    const { data,error } =
    await supabaseClient
    .from("players")
    .select("*");

    if(error){

        console.log(error);

        return;
    }

    allData = data;

    const board =
    document.getElementById("leaderboard");

    board.innerHTML = "";

    let search =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase();

    let groupedPlayers = {};

    data.forEach(entry => {

        if(
            currentFilter !== "ALL" &&
            entry.gamemode !== currentFilter
        ){
            return;
        }

        if(
            !entry.player
            .toLowerCase()
            .includes(search)
        ){
            return;
        }

        if(!groupedPlayers[entry.player]){

            groupedPlayers[entry.player] = {

                total:0
            };
        }

        groupedPlayers[entry.player].total +=
        tierRank[entry.tier];
    });

    let sortedPlayers =
    Object.entries(groupedPlayers);

    sortedPlayers.sort(
        (a,b)=>
        b[1].total-a[1].total
    );

    sortedPlayers.forEach(
    ([player,info],index)=>{

        let medal = "";

        if(index === 0) medal = "🥇";
        if(index === 1) medal = "🥈";
        if(index === 2) medal = "🥉";

        board.innerHTML += `

        <div
        class="player"
        onclick="openPlayer('${player}')"
        >

            <div class="rank">

                <span class="medal">
                ${medal}
                </span>

                ${player}

            </div>

            <div class="total">

                ⭐ ${info.total} punten totaal

            </div>

        </div>

        `;
    });

}

loadPlayers();

</script>

</body>
</html>
