"LT5":1,
"HT5":2,

"LT4":5,
"HT4":10,

"LT3":12,

/* =========================

function setFilter(mode){

/* =========================
ADD PLAYER
========================= */

async function addPlayer(){

const player =
document
.getElementById("playerName")
.value;

const gamemode =
document
.getElementById("gamemode")
.value;

const tier =
document
.getElementById("tier")
.value;

if(player === ""){

alert("Fill in player name");

return;

}

await supabaseClient
.from("players")
.insert([
{
player,
gamemode,
tier
}
]);

.value = "";

/* RELOAD */

);

/* =========================
LOAD PLAYERS
========================= */

async function loadPlayers(){

const { data,error } =
await supabaseClient
.from("players")
.select("*");

if(error){

console.log(error);

return;

}

allData = data;

/* COUNTS */

document
.getElementById("tiersCount")
.innerHTML =
data.length;

const uniquePlayers =
[...new Set(
data.map(x=>x.player)
)];

document
.getElementById("playersCount")
.innerHTML =
uniquePlayers.length;

/* BOARD */

const board =
document
.getElementById("leaderboard");

board.innerHTML = "";

/* GROUP */

let grouped = {};

/* SEARCH */

const search =
document
.getElementById("searchInput")
.value
.toLowerCase();

data.forEach(entry=>{

/* FILTER */

if(
currentFilter !== "ALL" &&
entry.gamemode !== currentFilter
){
return;
}

/* SEARCH */

if(
!entry.player
.toLowerCase()
.includes(search)
){
return;
}

/* GROUP */

if(!grouped[entry.player]){

grouped[entry.player] = {

points:0,
count:0

};

}

grouped[entry.player].points +=
tierPoints[entry.tier];

grouped[entry.player].count++;

});

/* SORT */

const sorted =
Object.entries(grouped)
.sort(
(a,b)=>
b[1].points - a[1].points
);

/* RENDER */

sorted.forEach(([name,data],index)=>{

const rank =
index + 1;

let crown = "";

if(rank === 1){

crown = "👑";

}else if(rank === 2){

crown = "🥈";

}else if(rank === 3){

crown = "🥉";

}

board.innerHTML += `

<div
class="player"
onclick="openPlayer('${name}')"
>

<div class="playerGlow"></div>

<div class="playerLeft">

<div class="rank">
${crown}
#${rank}
</div>

<div class="avatar">
${name.charAt(0).toUpperCase()}
</div>

<div class="playerInfo">

<h2>${name}</h2>

<p>
${data.count} tiers earned
</p>

</div>

</div>

<div class="points">

<h3>${data.points}</h3>

<p>Total Points</p>

</div>

</div>

`;

});

/* EMPTY */

if(sorted.length === 0){

board.innerHTML = `

<div style="
padding:60px;
text-align:center;
font-size:35px;
font-weight:900;
opacity:0.6;
">

No Players Found

</div>

`;

}

}

/* =========================
OPEN PLAYER
========================= */

function openPlayer(player){

selectedPlayer = player;

document
.getElementById("modal")
.style.display =
"flex";

/* PLAYER INFO */

document
.getElementById("modalName")
.innerHTML =
player;

document
.getElementById("bigAvatar")
.innerHTML =
player.charAt(0)
.toUpperCase();

/* FILTER */

const stats =
allData.filter(
x=>x.player===player
);

/* TOTAL */

let total = 0;

let html = "";

/* RENDER TIERS */

stats.forEach(entry=>{

total +=
tierPoints[entry.tier];

html += `

<div class="tier">

<div class="tierTop">

<div class="tierMode">
${entry.gamemode}
</div>

<div class="tierValue">
${entry.tier}
</div>

</div>

<div class="tierPoints">
${tierPoints[entry.tier]} Points
</div>

${
isAdmin
?
`

<button
class="deleteBtn"
onclick="deleteTier(${entry.id})"
>
Delete Tier
</button>

`
:
""
}

</div>

`;

});

/* TOTAL */

document
.getElementById("totalPoints")
.innerHTML =
total + " Total Points";

/* INSERT */

document
.getElementById("modalTiers")
.innerHTML =
html;

}

/* =========================
DELETE
========================= */

async function deleteTier(id){

if(!isAdmin){

alert("No Permission");

return;

}

const sure =
confirm(
"Delete Tier?"
);

if(!sure) return;

/* DELETE */

await supabaseClient
.from("players")
.delete()
.eq("id",id);

/* REFRESH */

closeModal();

loadPlayers();

showToast(
"Tier Deleted"
);

}

/* =========================
MODAL CLOSE
========================= */

function closeModal(){

document
.getElementById("modal")
.style.display =
"none";

}

/* =========================
TOAST
========================= */

function showToast(text){

const toast =
document.createElement("div");

toast.innerHTML =
text;

toast.style.position =
"fixed";

toast.style.bottom =
"30px";

toast.style.left =
"50%";

toast.style.transform =
"translateX(-50%)";

toast.style.padding =
"18px 28px";

toast.style.borderRadius =
"20px";

toast.style.background =
"linear-gradient(135deg,#00ff88,#00d0ff)";

toast.style.color =
"black";

toast.style.fontWeight =
"900";

toast.style.zIndex =
"999999";

toast.style.boxShadow =
"0 0 40px rgba(0,255,136,0.4)";

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},2500);

}

LIVE SEARCH
========================= */
