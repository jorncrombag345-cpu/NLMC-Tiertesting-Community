<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NL Tiers</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top left,#00ff8820,transparent 30%),
radial-gradient(circle at bottom right,#00d0ff20,transparent 30%),
#050816;

color:white;

overflow-x:hidden;

min-height:100vh;
}

/* SCROLLBAR */

::-webkit-scrollbar{
width:10px;
}

::-webkit-scrollbar-thumb{
background:#00ff88;
border-radius:20px;
}

/* NAVBAR */

.nav{

width:100%;

padding:25px 50px;

display:flex;

justify-content:space-between;

align-items:center;

position:sticky;

top:0;

backdrop-filter:blur(20px);

background:rgba(5,8,22,0.7);

z-index:100;
}

.logo{

font-size:50px;

font-weight:900;

letter-spacing:2px;
}

.logo span{

color:#00ff88;
}

.loginBox{

display:flex;

gap:12px;
}

.loginBox input{

padding:15px 18px;

background:rgba(255,255,255,0.06);

border:1px solid rgba(255,255,255,0.08);

border-radius:18px;

color:white;

outline:none;

font-size:15px;
}

.loginBox button{

padding:15px 22px;

border:none;

border-radius:18px;

font-weight:900;

cursor:pointer;

background:
linear-gradient(
135deg,
#00ff88,
#00d0ff
);

transition:0.25s;
}

.loginBox button:hover{

transform:scale(1.05);
}

/* HERO */

.hero{

padding:90px 20px 40px;

text-align:center;
}

.hero h1{

font-size:130px;

font-weight:900;

background:
linear-gradient(
90deg,
white,
#00ff88,
#00d0ff
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;
}

.hero p{

margin-top:14px;

font-size:24px;

color:#98a4bb;
}

/* SEARCH */

.searchArea{

max-width:900px;

margin:auto;

padding:20px;
}

.searchArea input{

width:100%;

padding:24px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

border-radius:24px;

color:white;

font-size:18px;

outline:none;

backdrop-filter:blur(10px);
}

/* FILTERS */

.filters{

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:14px;

padding:25px;
}

.filters button{

padding:14px 20px;

border:none;

border-radius:18px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

color:white;

font-weight:800;

cursor:pointer;

transition:0.25s;
}

.filters button:hover{

background:#00ff88;

color:black;

transform:translateY(-3px);
}

/* ADMIN */

.admin{

display:none;

width:95%;

max-width:1500px;

margin:auto;

padding:35px;

margin-top:20px;

margin-bottom:40px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

border-radius:35px;

backdrop-filter:blur(20px);
}

.admin h2{

font-size:38px;

margin-bottom:20px;
}

.adminGrid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:18px;
}

.adminGrid input,
.adminGrid select{

padding:18px;

border-radius:18px;

background:#111827;

border:
1px solid rgba(255,255,255,0.08);

color:white;

font-size:16px;

outline:none;
}

.adminGrid button{

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#00ff88,
#00d0ff
);

font-weight:900;

cursor:pointer;

font-size:16px;
}

/* LEADERBOARD */

#leaderboard{

width:100%;

max-width:1600px;

margin:auto;

padding:20px;

display:flex;

flex-direction:column;

gap:25px;
}

/* PLAYER CARD */

.player{

display:flex;

justify-content:space-between;

align-items:center;

padding:30px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

border-radius:36px;

backdrop-filter:blur(15px);

cursor:pointer;

transition:0.3s;
}

.player:hover{

transform:
translateY(-6px)
scale(1.01);

border:
1px solid rgba(0,255,136,0.5);

box-shadow:
0 0 50px rgba(0,255,136,0.15);
}

.playerLeft{

display:flex;

align-items:center;

gap:24px;
}

.rank{

width:90px;
height:90px;

border-radius:28px;

background:
linear-gradient(
135deg,
#ffd54f,
#ff9800
);

display:flex;

justify-content:center;

align-items:center;

font-size:34px;

font-weight:900;

color:black;
}

.avatar{

width:100px;
height:100px;

border-radius:30px;

background:
linear-gradient(
135deg,
#00ff88,
#00d0ff
);

display:flex;

justify-content:center;

align-items:center;

font-size:45px;

font-weight:900;

color:black;
}

.playerInfo h2{

font-size:42px;

font-weight:900;
}

.playerInfo p{

margin-top:6px;

color:#98a4bb;

font-size:18px;
}

.points{

text-align:right;
}

.points h3{

font-size:60px;

font-weight:900;

color:#00ff88;
}

.points p{

margin-top:8px;

color:#98a4bb;
}

/* MODAL */

.modal{

position:fixed;

inset:0;

background:
rgba(0,0,0,0.75);

display:none;

justify-content:center;

align-items:center;

backdrop-filter:blur(12px);

z-index:999;
}

.modalContent{

width:92%;

max-width:900px;

background:
linear-gradient(
145deg,
#111827,
#0b1020
);

padding:45px;

border-radius:40px;

border:
1px solid rgba(255,255,255,0.08);

max-height:90vh;

overflow:auto;
}

.modalTop{

text-align:center;

margin-bottom:35px;
}

.bigAvatar{

width:170px;
height:170px;

border-radius:45px;

background:
linear-gradient(
135deg,
#00ff88,
#00d0ff
);

display:flex;

justify-content:center;

align-items:center;

font-size:70px;

font-weight:900;

color:black;

margin:auto;

margin-bottom:20px;
}

.modalName{

font-size:75px;

font-weight:900;
}

.totalPoints{

margin-top:10px;

font-size:26px;

color:#00ff88;
}

.tiers{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:20px;
}

.tier{

padding:24px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

border-radius:28px;

text-align:center;
}

.tier h3{

font-size:22px;

color:#98a4bb;
}

.tier h2{

margin-top:10px;

font-size:44px;

font-weight:900;

color:#00ff88;
}

.tier p{

margin-top:10px;

color:#ffc107;

font-weight:700;
}

.deleteBtn{

margin-top:14px;

width:100%;

padding:12px;

border:none;

border-radius:14px;

background:red;

color:white;

font-weight:900;

cursor:pointer;
}

.closeBtn{

width:100%;

margin-top:28px;

padding:18px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#00ff88,
#00d0ff
);

font-size:18px;

font-weight:900;

cursor:pointer;
}

/* MOBILE */

@media(max-width:900px){

.hero h1{
font-size:70px;
}

.player{
flex-direction:column;
align-items:flex-start;
gap:25px;
}

.points{
text-align:left;
}

.nav{
flex-direction:column;
gap:18px;
padding:20px;
}

.modalName{
font-size:50px;
}

}

</style>

</head>
<body>

<div class="nav">

<div class="logo">
NL<span>TIERS</span>
</div>

<div class="loginBox">

<input
type="password"
id="password"
placeholder="Admin code"
>

<button onclick="login()">
LOGIN
</button>

</div>

</div>

<div class="hero">

<h1>Leaderboard</h1>

<p>Best Competitive Minecraft Players</p>

</div>

<div class="searchArea">

<input
type="text"
id="searchInput"
placeholder="Search player..."
onkeyup="loadPlayers()"
>

</div>

<div class="filters">

<button onclick="setFilter('ALL')">ALL</button>
<button onclick="setFilter('Mace')">MACE</button>
<button onclick="setFilter('Sword')">SWORD</button>
<button onclick="setFilter('Spear')">SPEAR</button>
<button onclick="setFilter('UHC')">UHC</button>
<button onclick="setFilter('Axe')">AXE</button>
<button onclick="setFilter('Speed')">SPEED</button>
<button onclick="setFilter('Vanilla')">VANILLA</button>
<button onclick="setFilter('DIA SMP')">DIA SMP</button>
<button onclick="setFilter('Cart')">CART</button>
<button onclick="setFilter('Creeper')">CREEPER</button>

</div>

<div class="admin" id="adminPanel">

<h2>Admin Panel</h2>

<div class="adminGrid">

<input
type="text"
id="playerName"
placeholder="Player Name"
>

<select id="gamemode">

<option>Mace</option>
<option>Sword</option>
<option>Spear</option>
<option>UHC</option>
<option>Axe</option>
<option>Speed</option>
<option>Vanilla</option>
<option>DIA SMP</option>
<option>Cart</option>
<option>Creeper</option>

</select>

<select id="tier">

<option>HT1</option>
<option>LT1</option>
<option>HT2</option>
<option>LT2</option>
<option>HT3</option>
<option>LT3</option>
<option>HT4</option>
<option>LT4</option>
<option>HT5</option>
<option>LT5</option>

</select>

<button onclick="addPlayer()">
ADD TIER
</button>

</div>

</div>

<div id="leaderboard"></div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modalContent">

<div class="modalTop">

<div class="bigAvatar" id="bigAvatar">
A
</div>

<div class="modalName" id="modalName">
Player
</div>

<div class="totalPoints" id="totalPoints">
0 Points
</div>

</div>

<div class="tiers" id="modalTiers"></div>

<button
class="closeBtn"
onclick="closeModal()"
>
Close
</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://mgtwbthpqinyxrcnglwt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kj1HG03vn4ZMqDgC8zWzhA_CRNDty9O";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_PASSWORD = "5676";

let isAdmin = false;

let currentFilter = "ALL";

let allData = [];

const tierPoints = {

"LT5":1,
"HT5":2,
"LT4":5,
"HT4":10,
"LT3":12,
"HT3":15,
"LT2":18,
"HT2":20,
"LT1":25,
"HT1":30

};

function login(){

const pass =
document.getElementById("password").value;

if(pass === ADMIN_PASSWORD){

isAdmin = true;

document
.getElementById("adminPanel")
.style.display = "block";

alert("Admin logged in");

}else{

alert("Wrong password");

}

}

function setFilter(mode){

currentFilter = mode;

loadPlayers();

}

async function addPlayer(){

const player =
document.getElementById("playerName").value;

const gamemode =
document.getElementById("gamemode").value;

const tier =
document.getElementById("tier").value;

if(player === "") return;

await supabaseClient
.from("players")
.insert([
{
player,
gamemode,
tier
}
]);

document
.getElementById("playerName")
.value = "";

loadPlayers();

}

async function loadPlayers(){

const { data,error } =
await supabaseClient
.from("players")
.select("*");

if(error){

console.log(error);

return;

}

allData = data;

const board =
document.getElementById("leaderboard");

board.innerHTML = "";

let grouped = {};

const search =
document
.getElementById("searchInput")
.value
.toLowerCase();

data.forEach(entry=>{

if(
currentFilter !== "ALL" &&
entry.gamemode !== currentFilter
){
return;
}

if(
!entry.player
.toLowerCase()
.includes(search)
){
return;
}

if(!grouped[entry.player]){

grouped[entry.player] = 0;

}

grouped[entry.player] +=
tierPoints[entry.tier];

});

const sorted =
Object.entries(grouped)
.sort((a,b)=>b[1]-a[1]);

sorted.forEach(([name,points],index)=>{

board.innerHTML += `

<div
class="player"
onclick="openPlayer('${name}')"
>

<div class="playerLeft">

<div class="rank">
#${index+1}
</div>

<div class="avatar">
${name.charAt(0).toUpperCase()}
</div>

<div class="playerInfo">

<h2>${name}</h2>

<p>Competitive Player</p>

</div>

</div>

<div class="points">

<h3>${points}</h3>

<p>Total Points</p>

</div>

</div>

`;

});

}

function openPlayer(player){

document
.getElementById("modal")
.style.display = "flex";

document
.getElementById("modalName")
.innerHTML = player;

document
.getElementById("bigAvatar")
.innerHTML =
player.charAt(0).toUpperCase();

const stats =
allData.filter(
x=>x.player===player
);

let total = 0;

let html = "";

stats.forEach(entry=>{

total += tierPoints[entry.tier];

html += `

<div class="tier">

<h3>${entry.gamemode}</h3>

<h2>${entry.tier}</h2>

<p>
${tierPoints[entry.tier]} points
</p>

${isAdmin ? `

<button
class="deleteBtn"
onclick="deleteTier(${entry.id})"
>
Delete Tier
</button>

` : ""}

</div>

`;

});

document
.getElementById("totalPoints")
.innerHTML =
total + " Total Points";

document
.getElementById("modalTiers")
.innerHTML = html;

}

async function deleteTier(id){

const sure =
confirm("Delete this tier?");

if(!sure) return;

await supabaseClient
.from("players")
.delete()
.eq("id",id);

closeModal();

loadPlayers();

}

function closeModal(){

document
.getElementById("modal")
.style.display = "none";

}

loadPlayers();

</script>

</body>
</html>
