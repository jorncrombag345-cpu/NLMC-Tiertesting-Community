<!DOCTYPE html>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at top,#141414,#070707 70%);

    color:white;

    min-height:100vh;

    overflow-x:hidden;
}

/* BACKGROUND GLOW */

.bgGlow{

    position:fixed;

    width:700px;
    height:700px;

    background:#00ff88;

    filter:blur(180px);

    opacity:0.08;

    border-radius:50%;

    top:-250px;
    left:50%;

    transform:translateX(-50%);

    z-index:-1;
}

/* NAVBAR */

.nav{

    width:100%;

    padding:25px 50px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.logo{

    font-size:34px;

    font-weight:800;

    letter-spacing:-1px;

    color:white;
}

.logo span{
    color:#00ff88;
}

.navRight{

    display:flex;

    gap:15px;
}

.nav input{

    background:#111;

    border:1px solid rgba(255,255,255,0.06);

    color:white;

    padding:14px 18px;

    border-radius:16px;

    width:220px;
}

.nav button{

    border:none;

    background:#00ff88;

    color:black;

    font-weight:700;

    padding:14px 20px;

    border-radius:16px;

    cursor:pointer;

    transition:0.25s;
}

.nav button:hover{

    transform:translateY(-2px);

    box-shadow:
    0 0 20px rgba(0,255,136,0.35);
}

/* HERO */

.hero{

    text-align:center;

    margin-top:20px;

    margin-bottom:45px;
}

.hero h1{

    font-size:90px;

    font-weight:800;

    letter-spacing:-4px;

    line-height:1;
}

.hero p{

    margin-top:18px;

    color:#8a8a8a;

    font-size:20px;
}

/* FILTERS */

.filters{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:12px;

    margin-bottom:40px;

    padding:0 20px;
}

.filters button{

    background:#101010;

    border:1px solid rgba(255,255,255,0.05);

    color:#d7d7d7;

    padding:12px 18px;

    border-radius:14px;

    cursor:pointer;

    transition:0.25s;
}

.filters button:hover{

    background:#00ff88;

    color:black;
}

/* LEADERBOARD */

#leaderboard{

    width:100%;

    max-width:1400px;

    margin:auto;

    display:flex;

    flex-direction:column;

    gap:18px;

    padding:0 25px 50px;
}

/* PLAYER */

.player{

    background:
    linear-gradient(
    145deg,
    rgba(18,18,18,0.95),
    rgba(10,10,10,0.95)
    );

    border:
    1px solid rgba(255,255,255,0.05);

    border-radius:28px;

    padding:26px 30px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    transition:0.3s;

    cursor:pointer;

    position:relative;

    overflow:hidden;
}

.player::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:4px;
    height:100%;

    background:#00ff88;
}

.player:hover{

    transform:
    translateY(-4px)
    scale(1.01);

    border:
    1px solid rgba(0,255,136,0.2);

    box-shadow:
    0 15px 40px rgba(0,255,136,0.08);
}

/* LEFT */

.left{

    display:flex;

    align-items:center;

    gap:22px;
}

.rank{

    font-size:34px;

    color:#5c5c5c;

    min-width:70px;
}

.avatar{

    width:70px;
    height:70px;

    border-radius:20px;

    background:
    linear-gradient(
    135deg,
    #00ff88,
    #00cfff
    );

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:28px;

    font-weight:800;

    color:black;
}

.playerInfo h2{

    font-size:28px;

    font-weight:700;
}

.playerInfo p{

    margin-top:6px;

    color:#909090;

    font-size:15px;
}

/* RIGHT */

.points{

    text-align:right;
}

.points h3{

    font-size:32px;

    color:#00ff88;

    font-weight:800;
}

.points p{

    color:#888;

    margin-top:4px;
}

/* MODAL */

.modal{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,0.75);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:999;
}

.modalContent{

    width:90%;

    max-width:750px;

    background:
    linear-gradient(
    145deg,
    #181818,
    #0d0d0d
    );

    border:
    1px solid rgba(255,255,255,0.05);

    border-radius:35px;

    padding:35px;

    animation:popup 0.25s ease;
}

@keyframes popup{

    from{
        opacity:0;
        transform:scale(0.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.modalName{

    font-size:50px;

    font-weight:800;

    margin-bottom:25px;
}

.stat{

    background:#101010;

    border:
    1px solid rgba(255,255,255,0.04);

    border-radius:18px;

    padding:18px;

    margin-bottom:14px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.closeBtn{

    width:100%;

    margin-top:20px;

    background:#00ff88;

    color:black;

    border:none;

    padding:16px;

    border-radius:18px;

    font-weight:700;

    cursor:pointer;
}

/* MOBILE */

@media(max-width:800px){

    .hero h1{
        font-size:60px;
    }

    .player{

        flex-direction:column;

        align-items:flex-start;

        gap:20px;
    }

    .points{
        text-align:left;
    }

    .nav{
        flex-direction:column;
        gap:20px;
    }
}

</style>

</head>
<body>

<div class="bgGlow"></div>

<div class="nav">

<div class="logo">
NL<span>TIERS</span>
</div>

<div class="navRight">

<input
type="password"
id="password"
placeholder="Admin code"
>

<button onclick="login()">
Login
</button>

</div>

</div>

<div class="hero">

<h1>Leaderboard</h1>

<p>Best Minecraft Competitive Players</p>

</div>

<div class="filters">

<button onclick="filterMode('ALL')">ALL</button>
<button onclick="filterMode('Spear')">SPEAR</button>
<button onclick="filterMode('Mace')">MACE</button>
<button onclick="filterMode('Sword')">SWORD</button>
<button onclick="filterMode('UHC')">UHC</button>
<button onclick="filterMode('Speed')">SPEED</button>
<button onclick="filterMode('Axe')">AXE</button>
<button onclick="filterMode('Vanilla')">VANILLA</button>
<button onclick="filterMode('DIA SMP')">DIA SMP</button>
<button onclick="filterMode('Cart')">CART</button>
<button onclick="filterMode('Creeper')">CREEPER</button>

</div>

<div id="leaderboard"></div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modalContent">

<div class="modalName" id="modalName">
Player
</div>

<div id="modalStats"></div>

<button class="closeBtn" onclick="closeModal()">
Close
</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://mgtwbthpqinyxrcnglwt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kj1HG03vn4ZMqDgC8zWzhA_CRNDty9O";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_PASSWORD = "5676";

const tierRank = {

    "LT5":1,
    "HT5":2,
    "LT4":5,
    "HT4":10,
    "LT3":12,
    "HT3":15,
    "LT2":18,
    "HT2":20,
    "LT1":25,
    "HT1":30
};

let currentFilter = "ALL";

let allData = [];

let isAdmin = false;

function login(){

    const pass =
    document.getElementById("password").value;

    if(pass === ADMIN_PASSWORD){

        isAdmin = true;

        alert("Admin login success");

    }else{

        alert("Wrong password");
    }
}

function filterMode(mode){

    currentFilter = mode;

    loadPlayers();
}

function getAvatar(name){

    return name.charAt(0).toUpperCase();
}

function openPlayer(player){

    const modal =
    document.getElementById("modal");

    const modalName =
    document.getElementById("modalName");

    const modalStats =
    document.getElementById("modalStats");

    modal.style.display = "flex";

    modalName.innerHTML = player;

    let playerData =
    allData.filter(x => x.player === player);

    let html = "";

    playerData.forEach(entry => {

        html += `

        <div class="stat">

            <div>

                <strong>${entry.gamemode}</strong>

                <div style="margin-top:5px;color:#888;">
                    ${entry.tier}
                </div>

            </div>

            <div style="color:#00ff88;font-weight:700;">
                ${tierRank[entry.tier]} pts
            </div>

        </div>

        `;
    });

    modalStats.innerHTML = html;
}

function closeModal(){

    document
    .getElementById("modal")
    .style.display = "none";
}

async function loadPlayers(){

    const { data,error } =
    await supabaseClient
    .from("players")
    .select("*");

    if(error){

        console.log(error);

        return;
    }

    allData = data;

    const board =
    document.getElementById("leaderboard");

    board.innerHTML = "";

    let groupedPlayers = {};

    data.forEach(entry => {

        if(
            currentFilter !== "ALL" &&
            entry.gamemode !== currentFilter
        ){
            return;
        }

        if(!groupedPlayers[entry.player]){

            groupedPlayers[entry.player] = {

                total:0
            };
        }

        groupedPlayers[entry.player].total +=
        tierRank[entry.tier];
    });

    let sortedPlayers =
    Object.entries(groupedPlayers);

    sortedPlayers.sort(
        (a,b)=>
        b[1].total-a[1].total
    );

    sortedPlayers.forEach(
    ([player,info],index)=>{

        board.innerHTML += `

        <div
        class="player"
        onclick="openPlayer('${player}')"
        >

            <div class="left">

                <div class="rank">
                    #${index+1}
                </div>

                <div class="avatar">
                    ${getAvatar(player)}
                </div>

                <div class="playerInfo">

                    <h2>${player}</h2>

                    <p>
                        Competitive Player
                    </p>

                </div>

            </div>

            <div class="points">

                <h3>${info.total}</h3>

                <p>Total Points</p>

            </div>

        </div>

        `;
    });

}

loadPlayers();

</script>

</body>
</html>
