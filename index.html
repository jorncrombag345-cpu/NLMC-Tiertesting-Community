```html
<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NL Tiers</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at top,#0d1220,#05070d 75%);

    color:white;

    overflow-x:hidden;

    min-height:100vh;
}

/* BACKGROUND */

.bg1{

    position:fixed;

    width:700px;
    height:700px;

    background:#00ff88;

    filter:blur(200px);

    opacity:0.08;

    border-radius:50%;

    top:-300px;
    left:-150px;

    z-index:-2;
}

.bg2{

    position:fixed;

    width:700px;
    height:700px;

    background:#7b5cff;

    filter:blur(200px);

    opacity:0.08;

    border-radius:50%;

    bottom:-300px;
    right:-150px;

    z-index:-2;
}

/* NAV */

.nav{

    width:100%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:30px 50px;
}

.logo{

    font-size:38px;

    font-weight:900;

    letter-spacing:-2px;
}

.logo span{

    color:#00ff88;
}

.navRight{

    display:flex;

    gap:15px;
}

.nav input{

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    color:white;

    padding:14px 18px;

    border-radius:16px;

    outline:none;
}

.nav button{

    border:none;

    background:
    linear-gradient(
    135deg,
    #00ff88,
    #00d0ff
    );

    color:black;

    font-weight:800;

    padding:14px 22px;

    border-radius:16px;

    cursor:pointer;

    transition:0.25s;
}

.nav button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 30px rgba(0,255,136,0.25);
}

/* HERO */

.hero{

    text-align:center;

    margin-top:20px;
}

.hero h1{

    font-size:100px;

    font-weight:900;

    letter-spacing:-5px;

    background:
    linear-gradient(
    90deg,
    white,
    #8eeeff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.hero p{

    margin-top:15px;

    color:#8e97aa;

    font-size:20px;
}

/* ADMIN PANEL */

.adminPanel{

    width:95%;

    max-width:1300px;

    margin:40px auto;

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border-radius:30px;

    padding:25px;

    display:none;
}

.adminTop{

    display:flex;

    flex-wrap:wrap;

    gap:15px;

    justify-content:center;
}

.adminTop input,
.adminTop select{

    background:#10151f;

    border:1px solid rgba(255,255,255,0.08);

    color:white;

    padding:14px;

    border-radius:16px;

    min-width:180px;
}

.adminTop button{

    border:none;

    background:#00ff88;

    color:black;

    font-weight:800;

    padding:14px 22px;

    border-radius:16px;

    cursor:pointer;
}

/* FILTERS */

.filters{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:12px;

    margin:20px 0 45px;
}

.filters button{

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,255,255,0.08);

    color:#d7d7d7;

    padding:12px 18px;

    border-radius:14px;

    cursor:pointer;

    transition:0.25s;
}

.filters button:hover{

    background:#00ff88;

    color:black;
}

/* BOARD */

#leaderboard{

    width:100%;

    max-width:1400px;

    margin:auto;

    display:flex;

    flex-direction:column;

    gap:22px;

    padding:0 25px 50px;
}

/* PLAYER CARD */

.player{

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border-radius:32px;

    padding:28px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    cursor:pointer;

    transition:0.3s;

    position:relative;

    overflow:hidden;
}

.player::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
    90deg,
    rgba(0,255,136,0.08),
    transparent
    );

    opacity:0;

    transition:0.3s;
}

.player:hover::before{

    opacity:1;
}

.player:hover{

    transform:
    translateY(-6px)
    scale(1.01);

    box-shadow:
    0 15px 45px rgba(0,0,0,0.35);
}

.left{

    display:flex;

    align-items:center;

    gap:22px;
}

.rank{

    width:70px;
    height:70px;

    border-radius:22px;

    background:
    linear-gradient(
    135deg,
    #ffd54f,
    #ff9800
    );

    color:black;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:28px;

    font-weight:900;
}

.avatar{

    width:80px;
    height:80px;

    border-radius:24px;

    background:
    linear-gradient(
    135deg,
    #00ff88,
    #00cfff
    );

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:30px;

    font-weight:900;

    color:black;
}

.playerInfo h2{

    font-size:34px;

    font-weight:800;
}

.playerInfo p{

    margin-top:6px;

    color:#8d96aa;
}

.points{

    text-align:right;
}

.points h3{

    font-size:42px;

    color:#00ff88;

    font-weight:900;
}

.points p{

    color:#8d96aa;
}

/* MODAL */

.modal{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,0.75);

    backdrop-filter:blur(10px);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:999;
}

.modalContent{

    width:92%;

    max-width:650px;

    background:
    linear-gradient(
    145deg,
    #0f1724,
    #0a0f18
    );

    border:
    1px solid rgba(255,255,255,0.08);

    border-radius:40px;

    padding:35px;

    animation:popup 0.25s ease;
}

@keyframes popup{

    from{
        opacity:0;
        transform:scale(0.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.modalTop{

    text-align:center;

    margin-bottom:30px;
}

.bigAvatar{

    width:120px;
    height:120px;

    border-radius:30px;

    background:
    linear-gradient(
    135deg,
    #00ff88,
    #00cfff
    );

    margin:auto;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:45px;

    font-weight:900;

    color:black;

    margin-bottom:18px;
}

.modalName{

    font-size:50px;

    font-weight:900;
}

.totalPoints{

    margin-top:10px;

    color:#00ff88;

    font-weight:700;

    font-size:20px;
}

/* TIER GRID */

.tierGrid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(120px,1fr));

    gap:16px;

    margin-top:25px;
}

.tierCard{

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,255,255,0.08);

    border-radius:24px;

    padding:18px;

    text-align:center;

    transition:0.25s;
}

.tierCard:hover{

    transform:translateY(-3px);
}

.tierMode{

    font-size:14px;

    color:#8d96aa;
}

.tierRank{

    margin-top:8px;

    font-size:26px;

    font-weight:900;

    color:#00ff88;
}

.tierPoints{

    margin-top:6px;

    color:#ffc107;

    font-size:14px;
}

.deleteBtn{

    margin-top:12px;

    width:100%;

    border:none;

    background:#ff3b3b;

    color:white;

    padding:10px;

    border-radius:12px;

    cursor:pointer;
}

.closeBtn{

    width:100%;

    margin-top:28px;

    border:none;

    background:
    linear-gradient(
    135deg,
    #00ff88,
    #00d0ff
    );

    color:black;

    font-weight:800;

    padding:16px;

    border-radius:18px;

    cursor:pointer;
}

/* MOBILE */

@media(max-width:850px){

    .hero h1{
        font-size:60px;
    }

    .player{

        flex-direction:column;

        align-items:flex-start;

        gap:22px;
    }

    .points{
        text-align:left;
    }

    .nav{

        flex-direction:column;

        gap:20px;
    }
}

</style>

</head>
<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="nav">

<div class="logo">
NL<span>TIERS</span>
</div>

<div class="navRight">

<input
type="password"
id="password"
placeholder="Admin code"
>

<button onclick="login()">
Login
</button>

</div>

</div>

<div class="hero">

<h1>Leaderboard</h1>

<p>Best Minecraft Competitive Players</p>

</div>

<!-- ADMIN -->

<div class="adminPanel" id="adminPanel">

<div class="adminTop">

<input
type="text"
id="playerName"
placeholder="Player Name"
>

<select id="gamemode">

<option>Spear</option>
<option>Mace</option>
<option>Sword</option>
<option>UHC</option>
<option>Speed</option>
<option>Axe</option>
<option>Vanilla</option>
<option>DIA SMP</option>
<option>Cart</option>
<option>Creeper</option>

</select>

<select id="tier">

<option>HT1</option>
<option>LT1</option>
<option>HT2</option>
<option>LT2</option>
<option>HT3</option>
<option>LT3</option>
<option>HT4</option>
<option>LT4</option>
<option>HT5</option>
<option>LT5</option>

</select>

<button onclick="addPlayer()">
Add Tier
</button>

</div>

</div>

<!-- FILTERS -->

<div class="filters">

<button onclick="filterMode('ALL')">ALL</button>
<button onclick="filterMode('Spear')">SPEAR</button>
<button onclick="filterMode('Mace')">MACE</button>
<button onclick="filterMode('Sword')">SWORD</button>
<button onclick="filterMode('UHC')">UHC</button>
<button onclick="filterMode('Speed')">SPEED</button>
<button onclick="filterMode('Axe')">AXE</button>
<button onclick="filterMode('Vanilla')">VANILLA</button>
<button onclick="filterMode('DIA SMP')">DIA SMP</button>
<button onclick="filterMode('Cart')">CART</button>
<button onclick="filterMode('Creeper')">CREEPER</button>

</div>

<div id="leaderboard"></div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modalContent">

<div class="modalTop">

<div class="bigAvatar" id="bigAvatar">
A
</div>

<div class="modalName" id="modalName">
Player
</div>

<div class="totalPoints" id="totalPoints">
0 Points
</div>

</div>

<div class="tierGrid" id="modalStats"></div>

<button class="closeBtn" onclick="closeModal()">
Close
</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://mgtwbthpqinyxrcnglwt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kj1HG03vn4ZMqDgC8zWzhA_CRNDty9O";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_PASSWORD = "5676";

const tierRank = {

    "LT5":1,
    "HT5":2,
    "LT4":5,
    "HT4":10,
    "LT3":12,
    "HT3":15,
    "LT2":18,
    "HT2":20,
    "LT1":25,
    "HT1":30
};

let currentFilter = "ALL";

let allData = [];

let isAdmin = false;

let currentPlayer = "";

function login(){

    const pass =
    document.getElementById("password").value;

    if(pass === ADMIN_PASSWORD){

        isAdmin = true;

        document
        .getElementById("adminPanel")
        .style.display = "block";

        alert("Admin login success");

    }else{

        alert("Wrong password");
    }
}

function filterMode(mode){

    currentFilter = mode;

    loadPlayers();
}

async function addPlayer(){

    const player =
    document.getElementById("playerName").value;

    const gamemode =
    document.getElementById("gamemode").value;

    const tier =
    document.getElementById("tier").value;

    if(player === "") return;

    await supabaseClient
    .from("players")
    .insert([
        {
            player,
            gamemode,
            tier
        }
    ]);

    document
    .getElementById("playerName")
    .value = "";

    loadPlayers();
}

async function deleteTier(id){

    await supabaseClient
    .from("players")
    .delete()
    .eq("id",id);

    openPlayer(currentPlayer);

    loadPlayers();
}

function getAvatar(name){

    return name.charAt(0).toUpperCase();
}

function openPlayer(player){

    currentPlayer = player;

    const modal =
    document.getElementById("modal");

    const modalName =
    document.getElementById("modalName");

    const modalStats =
    document.getElementById("modalStats");

    const totalPoints =
    document.getElementById("totalPoints");

    const bigAvatar =
    document.getElementById("bigAvatar");

    bigAvatar.innerHTML =
    getAvatar(player);

    modal.style.display = "flex";

    modalName.innerHTML = player;

    let playerData =
    allData.filter(x => x.player === player);

    let total = 0;

    let html = "";

    playerData.forEach(entry => {

        total += tierRank[entry.tier];

        html += `

        <div class="tierCard">

            <div class="tierMode">
                ${entry.gamemode}
            </div>

            <div class="tierRank">
                ${entry.tier}
            </div>

            <div class="tierPoints">
                ${tierRank[entry.tier]} pts
            </div>

            ${
                isAdmin
                ?
                `
                <button
                class="deleteBtn"
                onclick="deleteTier(${entry.id})"
                >
                Delete
                </button>
                `
                :
                ""
            }

        </div>

        `;
    });

    totalPoints.innerHTML =
    total + " Total Points";

    modalStats.innerHTML = html;
}

function closeModal(){

    document
    .getElementById("modal")
    .style.display = "none";
}

async function loadPlayers(){

    const { data,error } =
    await supabaseClient
    .from("players")
    .select("*");

    if(error){

        console.log(error);

        return;
    }

    allData = data;

    const board =
    document.getElementById("leaderboard");

    board.innerHTML = "";

    let groupedPlayers = {};

    data.forEach(entry => {

        if(
            currentFilter !== "ALL" &&
            entry.gamemode !== currentFilter
        ){
            return;
        }

        if(!groupedPlayers[entry.player]){

            groupedPlayers[entry.player] = {

                total:0
            };
        }

        groupedPlayers[entry.player].total +=
        tierRank[entry.tier];
    });

    let sortedPlayers =
    Object.entries(groupedPlayers);

    sortedPlayers.sort(
        (a,b)=>
        b[1].total-a[1].total
    );

    sortedPlayers.forEach(
    ([player,info],index)=>{

        board.innerHTML += `

        <div
        class="player"
        onclick="openPlayer('${player}')"
        >

            <div class="left">

                <div class="rank">
                    #${index+1}
                </div>

                <div class="avatar">
                    ${getAvatar(player)}
                </div>

                <div class="playerInfo">

                    <h2>${player}</h2>

                    <p>
                        Competitive Player
                    </p>

                </div>

            </div>

            <div class="points">

                <h3>${info.total}</h3>

                <p>Total Points</p>

            </div>

        </div>

        `;
    });

}

loadPlayers();

</script>

</body>
</html>
```
