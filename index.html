<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NL Tiers</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
}

.top{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
background:#111827;
}

.logo{
font-size:35px;
font-weight:bold;
}

.logo span{
color:#00ff88;
}

.login{
display:flex;
gap:10px;
}

input,select,button{
padding:12px;
border:none;
border-radius:10px;
}

button{
cursor:pointer;
font-weight:bold;
}

.login button{
background:#00ff88;
}

.search{
padding:20px;
text-align:center;
}

.search input{
width:80%;
max-width:600px;
background:#1f2937;
color:white;
}

.filters{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
padding:10px;
}

.filters button{
background:#1f2937;
color:white;
}

.filters button:hover{
background:#00ff88;
color:black;
}

.admin{
display:none;
padding:20px;
margin:20px;
background:#111827;
border-radius:20px;
}

.adminBox{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.admin input,
.admin select{
background:#1f2937;
color:white;
}

.admin button{
background:#00ff88;
}

#leaderboard{
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.player{
background:#111827;
padding:20px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
}

.player:hover{
transform:scale(1.01);
}

.left{
display:flex;
align-items:center;
gap:15px;
}

.rank{
background:#00ff88;
color:black;
width:50px;
height:50px;
display:flex;
justify-content:center;
align-items:center;
border-radius:12px;
font-weight:bold;
}

.avatar{
background:#1f2937;
width:60px;
height:60px;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
font-size:25px;
font-weight:bold;
}

.points{
font-size:30px;
font-weight:bold;
color:#00ff88;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
}

.modalContent{
background:#111827;
padding:30px;
border-radius:25px;
width:90%;
max-width:700px;
}

.modalTitle{
font-size:40px;
font-weight:bold;
margin-bottom:20px;
}

.tier{
background:#1f2937;
padding:15px;
border-radius:15px;
margin-bottom:12px;
}

.deleteBtn{
margin-top:10px;
background:red;
color:white;
width:100%;
}

.closeBtn{
margin-top:20px;
width:100%;
background:#00ff88;
}

</style>
</head>
<body>

<div class="top">

<div class="logo">
NL<span>TIERS</span>
</div>

<div class="login">

<input
type="password"
id="password"
placeholder="Admin code"
>

<button onclick="login()">
Login
</button>

</div>

</div>

<div class="search">

<input
type="text"
id="search"
placeholder="Search player..."
onkeyup="loadPlayers()"
>

</div>

<div class="filters">

<button onclick="setFilter('ALL')">ALL</button>
<button onclick="setFilter('Mace')">MACE</button>
<button onclick="setFilter('Sword')">SWORD</button>
<button onclick="setFilter('Spear')">SPEAR</button>
<button onclick="setFilter('UHC')">UHC</button>
<button onclick="setFilter('Axe')">AXE</button>
<button onclick="setFilter('Speed')">SPEED</button>
<button onclick="setFilter('Vanilla')">VANILLA</button>
<button onclick="setFilter('DIA SMP')">DIA SMP</button>
<button onclick="setFilter('Cart')">CART</button>
<button onclick="setFilter('Creeper')">CREEPER</button>

</div>

<div class="admin" id="adminPanel">

<h2>Add Tier</h2>

<div class="adminBox">

<input
type="text"
id="playerName"
placeholder="Player"
>

<select id="gamemode">

<option>Mace</option>
<option>Sword</option>
<option>Spear</option>
<option>UHC</option>
<option>Axe</option>
<option>Speed</option>
<option>Vanilla</option>
<option>DIA SMP</option>
<option>Cart</option>
<option>Creeper</option>

</select>

<select id="tier">

<option>HT1</option>
<option>LT1</option>
<option>HT2</option>
<option>LT2</option>
<option>HT3</option>
<option>LT3</option>
<option>HT4</option>
<option>LT4</option>
<option>HT5</option>
<option>LT5</option>

</select>

<button onclick="addPlayer()">
Add
</button>

</div>

</div>

<div id="leaderboard"></div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modalContent">

<div class="modalTitle" id="modalName">
Player
</div>

<div id="modalData"></div>

<button
class="closeBtn"
onclick="closeModal()"
>
Close
</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://mgtwbthpqinyxrcnglwt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kj1HG03vn4ZMqDgC8zWzhA_CRNDty9O";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_PASSWORD = "5676";

let isAdmin = false;

let currentFilter = "ALL";

let allPlayers = [];

const tierPoints = {

"LT5":1,
"HT5":2,
"LT4":5,
"HT4":10,
"LT3":12,
"HT3":15,
"LT2":18,
"HT2":20,
"LT1":25,
"HT1":30

};

function login(){

const pass =
document.getElementById("password").value;

if(pass === ADMIN_PASSWORD){

isAdmin = true;

document
.getElementById("adminPanel")
.style.display = "block";

alert("Admin logged in");

}else{

alert("Wrong password");

}

}

function setFilter(mode){

currentFilter = mode;

loadPlayers();

}

async function addPlayer(){

const player =
document.getElementById("playerName").value;

const gamemode =
document.getElementById("gamemode").value;

const tier =
document.getElementById("tier").value;

if(player === "") return;

await supabaseClient
.from("players")
.insert([
{
player,
gamemode,
tier
}
]);

document
.getElementById("playerName")
.value = "";

loadPlayers();

}

async function loadPlayers(){

const { data,error } =
await supabaseClient
.from("players")
.select("*");

if(error){

console.log(error);

return;

}

allPlayers = data;

const board =
document.getElementById("leaderboard");

board.innerHTML = "";

const grouped = {};

const search =
document
.getElementById("search")
.value
.toLowerCase();

data.forEach(entry=>{

if(
currentFilter !== "ALL" &&
entry.gamemode !== currentFilter
){
return;
}

if(
!entry.player
.toLowerCase()
.includes(search)
){
return;
}

if(!grouped[entry.player]){

grouped[entry.player] = 0;

}

grouped[entry.player] +=
tierPoints[entry.tier];

});

const sorted =
Object.entries(grouped)
.sort((a,b)=>b[1]-a[1]);

sorted.forEach(([name,points],index)=>{

board.innerHTML += `

<div
class="player"
onclick="openPlayer('${name}')"
>

<div class="left">

<div class="rank">
#${index+1}
</div>

<div class="avatar">
${name.charAt(0)}
</div>

<div>

<h2>${name}</h2>
<p>Competitive Player</p>

</div>

</div>

<div class="points">
${points}
</div>

</div>

`;

});

}

function openPlayer(player){

document
.getElementById("modal")
.style.display = "flex";

document
.getElementById("modalName")
.innerHTML = player;

const stats =
allPlayers.filter(
x=>x.player===player
);

let html = "";

stats.forEach(entry=>{

html += `

<div class="tier">

<b>${entry.gamemode}</b><br>
${entry.tier} -
${tierPoints[entry.tier]} points

${isAdmin ? `

<button
class="deleteBtn"
onclick="deleteTier(${entry.id})"
>
Delete Tier
</button>

` : ""}

</div>

`;

});

document
.getElementById("modalData")
.innerHTML = html;

}

async function deleteTier(id){

const sure =
confirm("Delete tier?");

if(!sure) return;

await supabaseClient
.from("players")
.delete()
.eq("id",id);

closeModal();

loadPlayers();

}

function closeModal(){

document
.getElementById("modal")
.style.display = "none";

}

loadPlayers();

</script>

</body>
</html>
